microcontroller:
  idmcu: 3 # id of mcu 
  namespace: "subsys3" # namespace
  generate_library_Path: "Arduino"  # path for generate library
  connection:
    type: "UART"   # ["UART","UDP"] 
    serial_port: "/dev/serial/by-id/usb-Arduino__www.arduino.cc__0043_95437313934351502122-if00"  # for Serial UART Subsystem 2"
    baudrate: 57620  # for UART
    ip_address_mcu: ""  # for UDP example "192.168.1.xx"
    udp_port_mcu: 0  # for UDP


ros: # setup ros is reference from microcontroller example publisher is mean microcontroller publish to ros network
  publisher:  [                           ]
  subscriber: [
    [1, "neck", "std_msgs/Int16.msg"],
    [2, "rothead", "std_msgs/Int16.msg"],
    [3, "jaw", "std_msgs/Int16.msg"],
    [4, "eye_x", "std_msgs/Int16.msg"],
    [5, "eye_y", "std_msgs/Int16.msg"]

  ]
  srv_client: [                           ]
  srv_server: [                           ]
  action_client: [                        ]
  action_server: [                        ]
